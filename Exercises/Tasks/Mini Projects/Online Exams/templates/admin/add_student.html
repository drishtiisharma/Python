<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Student</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>Admin Panel</h2>

            <div class="sidebar-section">

                <h3>Dashboard</h3>

                <button
                    onclick="window.location.href='/admin'"
                >
                    Dashboard
                </button>

            </div>


            <div class="sidebar-section">

                <h3>Students</h3>

                <button
                    onclick="window.location.href='/admin/students'"
                >
                    See All Students
                </button>

                <button
                    onclick="window.location.href='/admin/students/add'"
                >
                    Add Student
                </button>

            </div>


            <div class="sidebar-section">

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </aside>


        <!-- Main Content -->

        <main class="admin-content">

            <h1>Add Student</h1>

            <p id="message"></p>


            <form id="addStudentForm">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    id="addFname"
                    required
                >


                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    id="addLname"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="addEmail"
                    required
                >


                <label>
                    Role
                </label>

                <select
                    id="addRole"
                    required
                >

                    <option value="student">
                        Student
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>


                <button
                    type="submit"
                    id="addStudentBtn"
                >
                    Add Student
                </button>

            </form>

        </main>

    </div>


    <script src="/static/js/admin/add_student.js"></script>

</body>

</html>
