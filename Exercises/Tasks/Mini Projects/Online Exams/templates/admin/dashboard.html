<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="admin-layout">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>Admin Panel</h2>

            <div class="sidebar-section">

                <h3>Dashboard</h3>

                <button
                    onclick="window.location.href='/admin'"
                >
                    Dashboard
                </button>

            </div>


            <div class="sidebar-section">

                <h3>Students</h3>

                <button
                    onclick="window.location.href='/admin/students'"
                >
                    See All Students
                </button>

                <button
                    onclick="window.location.href='/admin/students/add'"
                >
                    Add Student
                </button>

            </div>


            <div class="sidebar-section">

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </aside>


        <!-- Main Content -->

        <main class="admin-content">

            <h1>Admin Dashboard</h1>

            <p id="message"></p>

            <section>

                <h2>Welcome to Admin Dashboard</h2>

                <p>
                    Use the sidebar to manage students.
                </p>

            </section>

        </main>

    </div>


    <script src="/static/js/admin/dashboard.js"></script>

</body>

</html>
