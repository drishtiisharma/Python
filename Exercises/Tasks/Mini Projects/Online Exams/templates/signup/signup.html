<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - Online Examination</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Online Examination</h1>

            <h2>New User Sign Up</h2>


            <form id="signupForm">


                <!-- First Name -->

                <div class="form-group">

                    <label for="fname">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="fname"
                        placeholder="Enter your first name"
                        required
                    >

                </div>


                <!-- Last Name -->

                <div class="form-group">

                    <label for="lname">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lname"
                        placeholder="Enter your last name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit">
                    Sign Up
                </button>


                <p id="message"></p>


            </form>


            <p>

                Already have an account?

                <a href="/">
                    Login
                </a>

            </p>


        </div>

    </div>


    <script src="/static/js/signup.js"></script>

</body>

</html>
