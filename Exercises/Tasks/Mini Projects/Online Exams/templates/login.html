<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Online Examination - Login</title>

    <link rel="stylesheet"
          href="/static/css/style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Online Examination</h1>

            <p class="subtitle">
                Student Login
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>

    <script src="/static/js/login.js"></script>

</body>

</html>
